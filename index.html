<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="dist/awesome-markers/dist/leaflet.awesome-markers.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        #map {
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        .legend {
            background: white;
            padding: 10px 12px;
            font-size: 12px;
            line-height: 20px;
            color: #333;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .legend h6 {
            margin: 0 0 6px;
            font-size: 13px;
            font-weight: bold;
        }

        .legend i {
            width: 16px;
            height: 16px;
            float: left;
            margin-right: 8px;
            opacity: 0.8;
            border: 1px solid #777;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="https://florestimurkab.go.id" target="_blank" rel="noopener noreferrer"><i class="bi bi-link-45deg"></i> Link</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#aboutModal"><i class="bi bi-info-circle"></i> About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div id="map"></div>

    <!-- Modal About -->
    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="aboutModalLabel"><i class="bi bi-info-circle"></i> About</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-borderless mb-0">
                        <tbody>
                            <tr>
                                <th style="width: 80px;">Nama</th>
                                <td>: Tiffani Arde Loveta</td>
                            </tr>
                            <tr>
                                <th>NIM</th>
                                <td>: 25/556459/SV/25935</td>
                            </tr>
                            <tr>
                                <th>Kelas</th>
                                <td>: A</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Jumlah Penduduk -->
    <div class="modal fade" id="pendudukModal" tabindex="-1" aria-labelledby="pendudukModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="pendudukModalLabel"><i class="bi bi-geo-alt-fill"></i> Detail Kecamatan</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="pendudukModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="dist/awesome-markers/dist/leaflet.awesome-markers.js"></script>

    <script>
        // Inisialisasi peta
        var map = L.map("map").setView([-8.3555810, 122.9935381], 10);

        // Custom Map Panes
        map.createPane("paneJumlahPenduduk");
        map.getPane("paneJumlahPenduduk").style.zIndex = 300;

        map.createPane("paneJalan");
        map.getPane("paneJalan").style.zIndex = 400;

        // Tile Layer Base Map
        var basemap = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            }
        );

        // Menambahkan basemap ke dalam peta
        basemap.addTo(map);

        // GeoJSON Point Toponimi
        var toponimi = L.geoJSON(null, {

            // Style
            pointToLayer: function (feature, latlng) {
                var unsur = feature.properties.NAMA_UNSUR || "";
                var iconName = "home";
                var markerColor = "green";

                if (unsur === "Gunung") {
                    iconName = "mountain";
                    markerColor = "darkred";
                } else if (unsur === "Tanjung") {
                    iconName = "flag";
                    markerColor = "orange";
                } else if (unsur === "Teluk") {
                    iconName = "water";
                    markerColor = "blue";
                } else {
                    iconName = "home";
                    markerColor = "green";
                }

                return L.marker(latlng, {
                    icon: L.AwesomeMarkers.icon({
                        icon: iconName,
                        prefix: "fa",
                        stylePrefix: "fas",
                        markerColor: markerColor,
                        iconColor: "white",
                    }),
                });
            },

            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var gambar = feature.properties.image ?
                    "<br><img src='images/" + feature.properties.image + "' width='200'>" : "";

                var popup_content = "Nama: " + feature.properties.TOPONIMI + "<br>" +
                    "Koordinat: " + feature.geometry.coordinates[1] + ", " +
                    feature.geometry.coordinates[0] + "<br>" + gambar;


                layer.on({
                    click: function (e) {
                        toponimi.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        toponimi.bindTooltip(feature.properties.TOPONIMI, {
                            direction: "left",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("geojson/toponimi.geojson", function (data) {
            toponimi.addData(data); // Menambahkan data ke dalam GeoJSON Point Toponimi
            map.addLayer(toponimi); // Menambahkan GeoJSON Point Toponimi ke dalam peta
        });

        // GeoJSON Polyline Jalan
        var jalan = L.geoJSON(null, {
            pane: "paneJalan",
            // Style
            style: function (feature) {
                var unsur = feature.properties.NAMA_UNSUR || "";
                if (unsur === "Jalan Propinsi" || unsur === "Jalan Provinsi") {
                    return {
                        color: "red",
                        opacity: 1,
                        weight: 3,
                    };
                } else if (unsur === "Jalan Kabupaten") {
                    return {
                        color: "red",
                        opacity: 1,
                        weight: 1.5,
                        dashArray: "10, 6", // garis putus-putus panjang
                    };
                } else {
                    return {
                        color: "red",
                        opacity: 1,
                        weight: 0.5,
                        dashArray: "3, 4", // garis putus-putus pendek
                    };
                }
            },
            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content = "Fungsi: " + feature.properties.NAMA_UNSUR + "<br>" +
                    "Panjang (km): " + feature.properties.panjang_km;

                layer.on({
                    click: function (e) {
                        jalan.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        jalan.bindTooltip(feature.properties.NAMA_UNSUR, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("geojson/jalan.geojson", function (data) {
            jalan.addData(data); // Menambahkan data ke dalam GeoJSON Polyline Jalan
            map.addLayer(jalan); // Menambahkan GeoJSON Polyline Jalan ke dalam peta
        });

        // Fungsi pewarnaan berdasarkan jumlah penduduk (gradasi magenta)
        function getColor(d) {
            return d > 18000 ? "#7a0177" : // Tinggi (Magenta Pekat/Gelap)
                   d >= 12000 ? "#e7298a" : // Sedang (Magenta Sedang)
                                "#fbb4b9";  // Rendah (Magenta Muda)
        }

        // GeoJSON Polygon Jumlah Penduduk
        var jumlah_penduduk = L.geoJSON(null, {
            pane: "paneJumlahPenduduk",
            // Style
            style: function (feature) {
                return {
                    color: "gray",
                    opacity: 1,
                    weight: 1,
                    fillColor: getColor(feature.properties.Sheet1_Penduduk),
                    fillOpacity: 0.7,
                };
            },
            // onEachFeature
            onEachFeature: function (feature, layer) {
                var jml = feature.properties.Sheet1_Penduduk;
                var tingkat = jml > 18000 ? "Tinggi" : (jml >= 12000 ? "Sedang" : "Rendah");

                layer.on({
                    click: function (e) {
                        var modalBody =
                            "<table class='table table-bordered table-striped mb-0'>" +
                            "<tbody>" +
                            "<tr><th style='width: 40%;'>Kecamatan</th><td>" + feature.properties.WADMKC + "</td></tr>" +
                            "<tr><th>Kabupaten</th><td>" + (feature.properties.WADMKK || "-") + "</td></tr>" +
                            "<tr><th>Provinsi</th><td>" + (feature.properties.WADMPR || "-") + "</td></tr>" +
                            "<tr><th>Jumlah Penduduk</th><td>" + jml.toLocaleString('id-ID') + " Jiwa</td></tr>" +
                            "<tr><th>Tingkat</th><td><span class='badge' style='background-color: " + getColor(jml) + "; color: white;'>" + tingkat + "</span></td></tr>" +
                            "</tbody>" +
                            "</table>";

                        document.getElementById("pendudukModalLabel").innerHTML =
                            "<i class='bi bi-geo-alt-fill'></i> Kecamatan " + feature.properties.WADMKC;
                        document.getElementById("pendudukModalBody").innerHTML = modalBody;

                        var pendudukModal = bootstrap.Modal.getOrCreateInstance(document.getElementById("pendudukModal"));
                        pendudukModal.show();
                    },
                    mouseover: function (e) {
                        jumlah_penduduk.bindTooltip(feature.properties.WADMKC + " (" + tingkat + ")", {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },

        });
        $.getJSON("geojson/jumlah_penduduk_lagi.geojson", function (data) {
            jumlah_penduduk.addData(data); // Menambahkan data ke dalam GeoJSON Polygon Jumlah Penduduk
            map.addLayer(jumlah_penduduk); // Menambahkan GeoJSON Polygon Jumlah Penduduk ke dalam peta
        });

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": basemap,
        };

        var overlayMaps = {
            "Toponimi": toponimi,
            "Jalan": jalan,
            "Jumlah Penduduk": jumlah_penduduk,
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps);
        controllayer.addTo(map);

        // Legenda Peta
        var legend = L.control({ position: "bottomright" });
        legend.onAdd = function (map) {
            var div = L.DomUtil.create("div", "legend");
            div.innerHTML =
                '<h6>Toponimi</h6>' +
                '<div style="display: flex; align-items: center; margin-bottom: 2px;"><i class="fas fa-mountain" style="color: #a83333; width: 18px; text-align: center; margin-right: 6px; border: none; float: none;"></i> Gunung</div>' +
                '<div style="display: flex; align-items: center; margin-bottom: 2px;"><i class="fas fa-flag" style="color: #f08a00; width: 18px; text-align: center; margin-right: 6px; border: none; float: none;"></i> Tanjung</div>' +
                '<div style="display: flex; align-items: center; margin-bottom: 2px;"><i class="fas fa-water" style="color: #38aadd; width: 18px; text-align: center; margin-right: 6px; border: none; float: none;"></i> Teluk</div>' +
                '<div style="display: flex; align-items: center; margin-bottom: 4px;"><i class="fas fa-home" style="color: #72b026; width: 18px; text-align: center; margin-right: 6px; border: none; float: none;"></i> Toponimi</div>' +
                '<hr style="margin: 6px 0;">' +
                '<h6>Jumlah Penduduk</h6>' +
                '<i style="background: #7a0177"></i> Tinggi (&gt; 18.000 jiwa)<br>' +
                '<i style="background: #e7298a"></i> Sedang (12.000 - 18.000 jiwa)<br>' +
                '<i style="background: #fbb4b9"></i> Rendah (&lt; 12.000 jiwa)<br>' +
                '<hr style="margin: 6px 0;">' +
                '<h6>Jaringan Jalan</h6>' +
                '<div style="display: flex; align-items: center; margin-bottom: 2px;"><svg width="24" height="8" style="margin-right: 6px;"><line x1="0" y1="4" x2="24" y2="4" stroke="red" stroke-width="3"/></svg> Jalan Provinsi</div>' +
                '<div style="display: flex; align-items: center; margin-bottom: 2px;"><svg width="24" height="8" style="margin-right: 6px;"><line x1="0" y1="4" x2="24" y2="4" stroke="red" stroke-width="1.5" stroke-dasharray="8,4"/></svg> Jalan Kabupaten</div>' +
                '<div style="display: flex; align-items: center;"><svg width="24" height="8" style="margin-right: 6px;"><line x1="0" y1="4" x2="24" y2="4" stroke="red" stroke-width="0.8" stroke-dasharray="2,3"/></svg> Jalan Lain</div>';
            return div;
        };
        legend.addTo(map);

        // Scale Bar
        L.control.scale({
            position: "bottomleft",
            imperial: false,
        }).addTo(map);
    </script>
</body>

</html>
