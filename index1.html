<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet JS</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Inisialisasi peta
        var map = L.map("map").setView([-8.3555810, 122.9935381], 10);

        // Tile Layer Base Map
        var basemap = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            }
        );

        // Menambahkan basemap ke dalam peta
        basemap.addTo(map);

        // GeoJSON Point Toponimi
        var toponimi = L.geoJSON(null, {

            // Style
            pointToLayer: function (feature, latlng) {
                return L.marker(latlng, {
                    icon: L.icon({
                        iconUrl: "home_marker.png", // icon marker
                        iconSize: [48, 48], // ukuran icon
                        iconAnchor: [24, 48], // posisi icon terhadap titik (point)
                        popupAnchor: [0, -48], // posisi popup terhadap icon
                        tooltipAnchor: [-16, -30], // posisi tooltip terhadap icon
                    }),
                });
            },

            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var gambar = feature.properties.image ?
                    "<br><img src='images/" + feature.properties.image + "' width='200'>" : "";

                var popup_content = "Nama: " + feature.properties.TOPONIMI + "<br>" +
                    "Koordinat: " + feature.geometry.coordinates[1] + ", " +
                    feature.geometry.coordinates[0] + "<br>" + gambar;


                layer.on({
                    click: function (e) {
                        toponimi.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        toponimi.bindTooltip(feature.properties.TOPONIMI, {
                            direction: "left",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("geojson/toponimi.geojson", function (data) {
            toponimi.addData(data); // Menambahkan data ke dalam GeoJSON Point Toponimi
            map.addLayer(toponimi); // Menambahkan GeoJSON Point Toponimi ke dalam peta
        });

        // GeoJSON Polyline Jalan
        var jalan = L.geoJSON(null, {
            // Style
            style: function (feature) {
                return {
                    color: "red",
                    opacity: 1,
                    weight: 3,
                };
            },
            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content = "Fungsi: " + feature.properties.NAMA_UNSUR + "<br>" +
                    "Panjang (km): " + feature.properties.panjang_km;

                layer.on({
                    click: function (e) {
                        jalan.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        jalan.bindTooltip(feature.properties.NAMA_UNSUR, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("geojson/jalan.geojson", function (data) {
            jalan.addData(data); // Menambahkan data ke dalam GeoJSON Polyline Jalan
            map.addLayer(jalan); // Menambahkan GeoJSON Polyline Jalan ke dalam peta
        });

        // GeoJSON Polygon Jumlah Penduduk
        var jumlah_penduduk = L.geoJSON(null, {
            // Style
            style: function (feature) {
                return {
                    color: "gray",
                    opacity: 1,
                    weight: 1,
                    fillColor: "#ff7a63",
                    fillOpacity: 0.3,
                };
            },
            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content = "Kecamatan: " + feature.properties.WADMKC + "<br>" +
                    "Jumlah Penduduk: " + feature.properties.Sheet1_Penduduk;

                layer.on({
                    click: function (e) {
                        jumlah_penduduk.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        jumlah_penduduk.bindTooltip(feature.properties.WADMKC, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },

        });
        $.getJSON("geojson/jumlah_penduduk_lagi.geojson", function (data) {
            jumlah_penduduk.addData(data); // Menambahkan data ke dalam GeoJSON Polygon Jumlah Penduduk
            map.addLayer(jumlah_penduduk); // Menambahkan GeoJSON Polygon Jumlah Penduduk ke dalam peta
        });

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": basemap,
        };

        var overlayMaps = {
            "Toponimi": toponimi,
            "Jalan": jalan,
            "Jumlah Penduduk": jumlah_penduduk,
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps);
        controllayer.addTo(map);
    </script>
</body>

</html>
